name: Notifications Automation Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-notifications-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Call notifications automation endpoint
        run: |
          set -euo pipefail

          response=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $NOTIFICATIONS_AUTOMATION_TOKEN" \
            "$NOTIFICATIONS_AUTOMATION_URL")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)

          echo "HTTP status: $status"
          echo "Response body: $body"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Automation endpoint failed"
            exit 1
          fi
        env:
          NOTIFICATIONS_AUTOMATION_TOKEN: ${{ secrets.NOTIFICATIONS_AUTOMATION_TOKEN }}
          NOTIFICATIONS_AUTOMATION_URL: ${{ secrets.NOTIFICATIONS_AUTOMATION_URL }}
