name: Weather Alerts Sync Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-alerts-sync
  cancel-in-progress: false

jobs:
  sync-weather-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Synchronize ČHMÚ weather alerts
        env:
          WEATHER_ALERTS_AUTOMATION_TOKEN: ${{ secrets.WEATHER_ALERTS_AUTOMATION_TOKEN }}
          WEATHER_ALERTS_AUTOMATION_URL: ${{ secrets.WEATHER_ALERTS_AUTOMATION_URL }}
        run: |
          set -euo pipefail

          response=$(curl --silent --show-error \
            --retry 2 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 150 \
            --write-out '\n%{http_code}' \
            -H "Authorization: Bearer $WEATHER_ALERTS_AUTOMATION_TOKEN" \
            "$WEATHER_ALERTS_AUTOMATION_URL")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)

          echo "HTTP status: $status"
          echo "Response body: $body"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Weather alerts synchronization failed"
            exit 1
          fi
