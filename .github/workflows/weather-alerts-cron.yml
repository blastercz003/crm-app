name: Weather Alerts Sync Cron

on:
  # Supabase pg_cron is the primary scheduler. This workflow remains available
  # only as a manual emergency trigger so duplicate automatic runs cannot occur.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-alerts-sync
  cancel-in-progress: false

jobs:
  sync-weather-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Synchronize ČHMÚ weather alerts
        env:
          WEATHER_ALERTS_AUTOMATION_TOKEN: ${{ secrets.WEATHER_ALERTS_AUTOMATION_TOKEN }}
          WEATHER_ALERTS_AUTOMATION_URL: ${{ secrets.WEATHER_ALERTS_AUTOMATION_URL }}
        run: |
          set -euo pipefail

          if [ -z "${WEATHER_ALERTS_AUTOMATION_TOKEN:-}" ]; then
            echo "Missing GitHub Actions secret: WEATHER_ALERTS_AUTOMATION_TOKEN"
            exit 1
          fi
          if [ -z "${WEATHER_ALERTS_AUTOMATION_URL:-}" ]; then
            echo "Missing GitHub Actions secret: WEATHER_ALERTS_AUTOMATION_URL"
            exit 1
          fi

          response=$(curl --silent --show-error \
            --retry 2 \
            --retry-delay 5 \
            --retry-max-time 220 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 105 \
            --write-out '\n%{http_code}' \
            -H "Authorization: Bearer $WEATHER_ALERTS_AUTOMATION_TOKEN" \
            -H "Accept: application/json" \
            -H "User-Agent: B-Energy-Weather-Alerts-Cron/1.0" \
            "$WEATHER_ALERTS_AUTOMATION_URL")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)

          echo "HTTP status: $status"
          echo "Response body: $body"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Weather alerts synchronization failed"
            exit 1
          fi
